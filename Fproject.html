<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-box {
        width: 350px;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
    }

    input:focus {
        border-color: #667eea;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #764ba2;
    }

    p {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
    }

    a {
        color: #667eea;
        text-decoration: none;
    }
</style>

</head><body><div class="login-box">

    <h2>Login</h2>

    <form action="#" method="post">

        <label for="username">Username</label>
        <input type="text" id="username"
               name="username"
               placeholder="Enter your username"
               required>
<h1></h1>
        <label for="password">Password</label>
        <input type="password" id="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">Login</button>

        <p>Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </form>

</div>

</body>
</html>
